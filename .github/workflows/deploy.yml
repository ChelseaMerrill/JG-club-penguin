# Production deploy, run on every push to main (or manually via workflow_dispatch).
#
# Gating, in order:
#   changes   -> always runs; works out which migrations / Edge Functions changed.
#   migrate   -> runs only if migrations changed; approval-gated by the `production`
#                environment. A failed or rejected migrate blocks functions and vercel.
#   functions -> deploys only the changed Edge Functions; also approval-gated by the
#                `production` environment (it reads the same environment secrets).
#   vercel    -> builds and deploys the static site; runs only after migrate and
#                functions have succeeded or been skipped.
#
# Baseline guard: `migrate` refuses to `db push` unless migration 20260924000000 is
# recorded on both Local and Remote, i.e. the one-time baseline described in README.md
# (Database migrations and production deploys) has been done.
#
# Vercel's own git deploy for main is disabled in vercel.json; this workflow is the
# only production deploy path.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_migrations:
        description: Run supabase db push even if no migration changed
        type: boolean
        default: false
      force_functions:
        description: Deploy every Edge Function
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      migrations: ${{ steps.detect.outputs.migrations }}
      functions: ${{ steps.detect.outputs.functions }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect changed migrations and functions
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          INPUT_RUN_MIGRATIONS: ${{ inputs.run_migrations }}
          INPUT_FORCE_FUNCTIONS: ${{ inputs.force_functions }}
        run: |
          set -euo pipefail

          all_functions() {
            if [ -d supabase/functions ]; then
              find supabase/functions -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | sort | jq -R . | jq -sc .
            else
              echo '[]'
            fi
          }

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            migrations="$INPUT_RUN_MIGRATIONS"
            if [ "$INPUT_FORCE_FUNCTIONS" = "true" ]; then
              functions="$(all_functions)"
            else
              functions='[]'
            fi
          else
            if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]] || ! changed="$(git diff --name-only "$BASE" "$HEAD_SHA")"; then
              echo "No usable base commit; failing safe (migrations=true, all functions)."
              migrations=true
              functions="$(all_functions)"
            else
              if printf '%s\n' "$changed" | grep -q '^supabase/migrations/'; then
                migrations=true
              else
                migrations=false
              fi
              names="$(printf '%s\n' "$changed" | sed -nE 's#^supabase/functions/([^/]+)/.*#\1#p' | sort -u)"
              existing=""
              for n in $names; do
                if [ -d "supabase/functions/$n" ]; then
                  existing="$existing$n"$'\n'
                fi
              done
              functions="$(printf '%s' "$existing" | jq -R . | jq -sc 'map(select(length > 0))')"
            fi
          fi

          echo "migrations=$migrations"
          echo "functions=$functions"
          echo "migrations=$migrations" >> "$GITHUB_OUTPUT"
          echo "functions=$functions" >> "$GITHUB_OUTPUT"

  migrate:
    needs: changes
    if: needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Link Supabase project
        run: npx supabase@2.121.0 link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Baseline guard
        run: |
          set -euo pipefail
          list="$(npx supabase@2.121.0 migration list --linked)"
          echo "$list"
          if ! echo "$list" | grep -qE '20260924000000[[:space:]]*\|[[:space:]]*20260924000000'; then
            echo "Baseline missing: run the one-time baseline in README.md (Database migrations and production deploys) before the first deploy"
            exit 1
          fi
      - name: Push migrations
        run: npx supabase@2.121.0 db push
      - name: Migration list after push
        run: npx supabase@2.121.0 migration list --linked

  functions:
    needs: [changes, migrate]
    if: ${{ !cancelled() && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') && needs.changes.outputs.functions != '[]' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      FUNCTIONS: ${{ needs.changes.outputs.functions }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Deploy Edge Functions
        run: |
          set -euo pipefail
          for name in $(echo "$FUNCTIONS" | jq -r '.[]'); do
            echo "Deploying function: $name"
            npx supabase@2.121.0 functions deploy "$name" --project-ref "$SUPABASE_PROJECT_ID"
          done

  vercel:
    needs: [changes, migrate, functions]
    if: ${{ !cancelled() && (needs.migrate.result == 'success' || needs.migrate.result == 'skipped') && (needs.functions.result == 'success' || needs.functions.result == 'skipped') }}
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install Vercel CLI
        run: npm install -g vercel@65.1.0
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"
      - name: Deploy
        run: |
          url="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "Deployed: $url"
