r+='<ellipse cx="'+P(...PC)[0]+'" cy="'+(P(...PC)[1]+6)+'" rx="150" ry="60" fill="#000" opacity=".25"/>';
for(let k=0;k<6;k++){const k2=(k+1)%6;r+='<polygon points="'+pts([bot[k],bot[k2],top[k2],top[k]])+'" fill="'+['#0C4B5F','#0a3d4d','#082f3c','#082f3c','#0a3d4d','#0C4B5F'][k]+'" stroke="#06303D" stroke-width="2"/>';}
r+='<polygon points="'+pts(top)+'" fill="#161719" stroke="#00BDFF" stroke-width="3"/>';
r+='<polygon points="'+pts(hex(1.05,.9))+'" fill="none" stroke="#0C4B5F" stroke-width="3"/>';
document.getElementById('room').innerHTML=r;

/* ---------- globe ---------- */
const [gcx,pTopY]=P(...PC,.9);
const R=175,GC=[gcx,pTopY-R-6];
const gG=d3.select('#globeG');
d3.select('#clipC').attr('cx',GC[0]).attr('cy',GC[1]).attr('r',R);
gG.append('ellipse').attr('cx',GC[0]).attr('cy',pTopY-4).attr('rx',70).attr('ry',18).attr('fill','#00BDFF').attr('opacity',.35);
gG.append('rect').attr('x',GC[0]-10).attr('y',GC[1]+R-8).attr('width',20).attr('height',pTopY-GC[1]-R+4).attr('fill','#494949').attr('stroke','#0C4B5F').attr('stroke-width',2);
gG.append('circle').attr('cx',GC[0]).attr('cy',GC[1]).attr('r',R+26).attr('fill','url(#glow)');
const body=gG.append('g').attr('clip-path','url(#globeClip)');
body.append('circle').attr('cx',GC[0]).attr('cy',GC[1]).attr('r',R).attr('fill','url(#ocean)');
const gratP=body.append('path').attr('fill','none').attr('stroke','#00BDFF').attr('stroke-opacity',.18).attr('stroke-width',1);
const landP=body.append('path').attr('fill','#d3ebf3').attr('stroke','#0C4B5F').attr('stroke-width',1.2);
const statesP=body.append('path').attr('fill','none').attr('stroke','#0C4B5F').attr('stroke-opacity',.35).attr('stroke-width',.8);
const arcs=body.append('g');
const pinsG=body.append('g');
gG.append('circle').attr('cx',GC[0]).attr('cy',GC[1]).attr('r',R).attr('fill','url(#shine)').attr('pointer-events','none');
gG.append('circle').attr('cx',GC[0]).attr('cy',GC[1]).attr('r',R).attr('fill','none').attr('stroke','#00BDFF').attr('stroke-width',4);
// meridian ring
gG.append('path').attr('d','M'+(GC[0]-R-14)+','+GC[1]+' A'+(R+14)+','+(R+14)+' 0 0 1 '+(GC[0]+R+14)+','+GC[1]).attr('fill','none').attr('stroke','#494949').attr('stroke-width',8).attr('stroke-linecap','round').attr('transform','rotate(-23 '+GC[0]+' '+GC[1]+')');

const proj=d3.geoOrthographic().translate(GC).scale(R).clipAngle(90).precision(.3);
const path=d3.geoPath(proj);
const grat=d3.geoGraticule10();
let land=null,borders=null;
let view={lon:60,lat:-28,k:1};
let spinning=true,sel=-1;

const hexPts=(cx,cy,rad)=>{const a=[];for(let i=0;i<6;i++){const t=Math.PI/3*i-Math.PI/2;a.push([cx+rad*Math.cos(t),cy+rad*Math.sin(t)]);}return a.map(p=>p.join(',')).join(' ');};
const pinData=[{...HQ,hq:true,name:'JG HQ'}].concat(REMOTE.map((p,i)=>({...p,i})));
const pins=pinsG.selectAll('g').data(pinData).enter().append('g').attr('class','pin')
  .on('click',(e,d)=>{if(!d.hq)fly(d.i);});
pins.append('line').attr('class','stem').attr('stroke','#161719').attr('stroke-width',2);
pins.append('polygon').attr('class','hx');
pins.append('g').attr('class','lbl');

function draw(){
  proj.rotate([-view.lon,-view.lat]).scale(R*view.k);
  gratP.attr('d',path(grat));
  if(land)landP.attr('d',path(land));
  statesP.attr('d',borders&&view.k>2?path(borders):null);
  const zoomed=view.k>2.2;
  const c=[view.lon,view.lat];
  // arcs HQ -> each remote
  const arcD=REMOTE.map(p=>path({type:'LineString',coordinates:[[HQ.lon,HQ.lat],[p.lon,p.lat]]})).filter(Boolean);
  const as=arcs.selectAll('path').data(arcD);
  as.enter().append('path').attr('fill','none').attr('stroke','#00BDFF').attr('stroke-width',2).attr('stroke-dasharray','5 5').merge(as).attr('d',d=>d).attr('opacity',zoomed?.9:.6);
  as.exit().remove();
  pins.each(function(d){
    const vis=d3.geoDistance([d.lon,d.lat],c)<Math.PI/2-.02;
    const g=d3.select(this).attr('display',vis?null:'none');
    if(!vis)return;
    const [x,y]=proj([d.lon,d.lat]);
    const big=zoomed?1.6:1, on=d.i===sel;
    const h=(d.hq?14:10)*big;
    g.select('.stem').attr('x1',x).attr('y1',y).attr('x2',x).attr('y2',y-h*1.4);
    g.select('.hx').attr('points',hexPts(x,y-h*1.4-h*.2,h*(on?1.3:1)))
      .attr('fill',d.hq?'#F4F4F4':(on?'#F4F4F4':'#00BDFF')).attr('stroke','#161719').attr('stroke-width',2.5);
    const L=g.select('.lbl');
    if(zoomed||d.hq&&!zoomed){
      const t=d.hq?'HQ':d.name.split(' ')[0];
      const tw=t.length*7.4+18;
      L.html('<rect x="'+(x-tw/2)+'" y="'+(y-h*3.2-18)+'" width="'+tw+'" height="20" rx="10" fill="'+(on?'#00BDFF':'#161719')+'" stroke="#0C4B5F" stroke-width="2"/><text x="'+x+'" y="'+(y-h*3.2-4)+'" text-anchor="middle" font-family="Libre Franklin, sans-serif" font-weight="700" font-size="11" fill="'+(on?'#161719':'#F4F4F4')+'">'+t+'</text>');
    } else L.html('');
  });
  if(sel>=0)pins.filter(d=>d.i===sel).raise();
}

let anim=null;
function tweenTo(lon,lat,k,ms){
  if(anim)anim.stop();
  const i=d3.interpolate([view.lon,view.lat,view.k],[lon,lat,k]);
  // shortest longitude path
  let dl=((lon-view.lon)%360+540)%360-180; const l0=view.lon;
  anim=d3.timer(el=>{const t=Math.min(1,el/ms),e=d3.easeCubicInOut(t);const v=i(e);view={lon:l0+dl*e,lat:v[1],k:v[2]};draw();if(t>=1){anim.stop();anim=null;view.lon=((view.lon+540)%360)-180;}});
}
function fly(i){
  sel=i;spinning=false;const p=REMOTE[i];
  tweenTo(p.lon,p.lat,14,1400);
  setFigs();showCard();
}
function world(){
  sel=-1;setFigs();document.getElementById('card').style.display='none';
  tweenTo(view.lon,30,1,1100);
  setTimeout(()=>{if(sel<0)spinning=true;},1150);
}
d3.timer(()=>{if(spinning&&!anim){view.lon+=.12;if(view.lat<28)view.lat+=.25;draw();}});

/* ---------- people on the floor ---------- */
const spots=[[1,4.4],[2.4,7.6],[5.6,9],[8.2,8.8],[10.2,6.6],[10.4,3.2],[0.8,8.6],[11,1],[11.6,6.2],[8,10],[8.4,0.2],[9.8,8],[5,10],[6.6,0],[12,0],[0,4.6],[12,10],[8.4,4.2]];
const figs=d3.select('#figs');
const FIGPOS=[];
const order=REMOTE.map((p,i)=>({p,i,s:spots[i]})).sort((a,b)=>(a.s[0]+a.s[1])-(b.s[0]+b.s[1]));
order.forEach(({p,i,s})=>{
  const [px,py]=P(s[0],s[1]);const sc=.66,w=120*sc,h=130*sc;
  const tag=p.name.split(' ')[0];const tw=tag.length*7.5+22;
  const g=figs.append('g').attr('class','fig').attr('data-i',i).on('click',()=>fly(i));
  g.append('ellipse').attr('class','ring').attr('cx',px).attr('cy',py).attr('rx',w*.46).attr('ry',w*.18).attr('fill','none').attr('stroke','#00BDFF').attr('stroke-width',4).attr('opacity',0);
  g.append('ellipse').attr('cx',px).attr('cy',py).attr('rx',w*.36).attr('ry',w*.13).attr('fill','#000').attr('opacity',.4);
  const PLAY={kneeland:'playTrumpet',shirk:'playHarp'};
  const moves=['idleBob','idleSway','idleBreathe','idleNod','idleHop'],mv=PLAY[p.key]||moves[i%moves.length],dur=(mv==='idleNod'||mv==='idleHop'?3.2:2)+((i*0.37)%1.4);
  g.append('g').attr('class','body').style('animation',mv+' '+dur.toFixed(2)+'s ease-in-out '+(-(i*0.53)%dur).toFixed(2)+'s infinite').append('svg').attr('x',px-w/2).attr('y',py-h+5*sc).attr('width',w).attr('height',h).attr('viewBox','0 0 120 130').html(HUM(p,'r'+p.key));
  FIGPOS[i]={px,py,h};
  const NOTE={kneeland:[112,50],shirk:[104,62]}[p.key];
  if(NOTE){const nx=px-w/2+NOTE[0]*sc,ny=py-h+5*sc+NOTE[1]*sc;for(let k=0;k<3;k++){g.append('path').attr('class','note').attr('d','M'+(nx+k*4)+' '+(ny-k*3)+' v-9 l6 -2 v9').attr('fill','none').attr('stroke','#00BDFF').attr('stroke-width',2).attr('stroke-linecap','round').style('animation-delay',(k*0.8)+'s');g.append('circle').attr('class','note').attr('cx',nx+k*4-1.6).attr('cy',ny-k*3).attr('r',2.4).attr('fill','#00BDFF').style('animation-delay',(k*0.8)+'s');}}
  const t=g.append('g').attr('class','tag');
  t.append('rect').attr('x',px-tw/2).attr('y',py-h-22).attr('width',tw).attr('height',22).attr('rx',11).attr('fill','#161719').attr('stroke','#0C4B5F').attr('stroke-width',2);
  t.append('text').attr('x',px).attr('y',py-h-7).attr('text-anchor','middle').attr('font-family','Libre Franklin, sans-serif').attr('font-weight',700).attr('font-size',12).attr('fill','#F4F4F4').text(tag);
});
/* ---------- quote pop-ups ---------- */
const bubbleL=d3.select('#scene').append('g');
function wrap(s,n){const w=s.split(' '),L=[];let c='';w.forEach(x=>{if((c+' '+x).trim().length>n){L.push(c.trim());c=x;}else c+=' '+x;});if(c.trim())L.push(c.trim());return L;}
let lastQ=-1;
function popQuote(){
  const pool=REMOTE.map((p,i)=>i).filter(i=>REMOTE[i].line&&i!==lastQ&&i!==sel);if(!pool.length)return;
  const i=pool[Math.floor(Math.random()*pool.length)];lastQ=i;const p=REMOTE[i],f=FIGPOS[i];
  const lines=wrap(p.line,24),lh=15,bw=Math.max(...lines.map(l=>l.length))*6.6+22,bh=lines.length*lh+14;
  let bx=Math.min(Math.max(f.px-bw/2,350),1564-bw);const by=f.py-f.h-30-bh;
  const g=bubbleL.append('g').attr('class','bubble').style('opacity',0).style('transform','translateY(6px)');
  g.append('rect').attr('x',bx).attr('y',by).attr('width',bw).attr('height',bh).attr('rx',10).attr('fill','#F4F4F4').attr('stroke','#0C4B5F').attr('stroke-width',2.5);
  g.append('path').attr('d','M'+(f.px-7)+' '+(by+bh-1)+' L'+f.px+' '+(by+bh+9)+' L'+(f.px+7)+' '+(by+bh-1)+' Z').attr('fill','#F4F4F4').attr('stroke','#0C4B5F').attr('stroke-width',2.5).attr('stroke-linejoin','round');
  g.append('rect').attr('x',f.px-6).attr('y',by+bh-3).attr('width',12).attr('height',4).attr('fill','#F4F4F4');
  lines.forEach((l,k)=>g.append('text').attr('x',bx+bw/2).attr('y',by+19+k*lh).attr('text-anchor','middle').attr('font-family','Libre Franklin, sans-serif').attr('font-weight',700).attr('font-size',12).attr('fill','#161719').text(l));
  requestAnimationFrame(()=>g.style('opacity',1).style('transform','translateY(0)'));
  setTimeout(()=>{g.style('opacity',0).style('transform','translateY(-6px)');setTimeout(()=>g.remove(),350);},3200);
}
setTimeout(popQuote,1200);setInterval(popQuote,4000);
function setFigs(){
  figs.selectAll('.fig').each(function(){const g=d3.select(this),on=+g.attr('data-i')===sel;g.select('.ring').attr('opacity',on?1:0);});
  document.querySelectorAll('#roster button').forEach((b,j)=>b.setAttribute('aria-pressed',j===sel));
}

/* ---------- roster + card ---------- */
const ro=document.getElementById('roster');
REMOTE.forEach((p,i)=>{
  const b=document.createElement('button');b.setAttribute('aria-pressed','false');
  b.innerHTML='<svg viewBox="22 6 76 70" width="32" height="30" style="flex:none;background:#0A0C0F;border:2px solid #0C4B5F;">'+HUM(p,'ro'+p.key)+'</svg><span style="display:flex;flex-direction:column;gap:0;min-width:0;"><span style="font:400 13px/1.15 \'Anton\',sans-serif;letter-spacing:.06em;text-transform:uppercase;color:#F4F4F4;">'+p.name+'</span><span style="font:500 11px/1.2 \'Libre Franklin\',sans-serif;color:#B3B6C9;">'+p.city+'</span></span>';
  b.onclick=()=>fly(i);ro.appendChild(b);
});
function miles(a,b){return Math.round(d3.geoDistance([a.lon,a.lat],[b.lon,b.lat])*3958.8);}
function showCard(){
  const p=REMOTE[sel],c=document.getElementById('card');c.style.display='flex';
  document.getElementById('cIdx').textContent=(sel+1)+' / '+REMOTE.length;
  document.getElementById('cAv').innerHTML=HUM(p,'cv'+p.key);
  document.getElementById('cName').textContent=p.name;
  document.getElementById('cTitle').textContent=p.title;
  document.getElementById('cLoc').textContent=p.city;
  document.getElementById('cLine').textContent=p.line||'';
  document.getElementById('cDist').textContent=miles(p,HQ)+' mi';
}
document.getElementById('world').onclick=world;
document.getElementById('next').onclick=()=>fly((sel+1)%REMOTE.length);
document.getElementById('prev').onclick=()=>fly((sel-1+REMOTE.length)%REMOTE.length);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sel>=0)world();});

draw();
Promise.all([
  fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json').then(r=>r.json()),
  fetch('https://cdn.jsdelivr.net/npm/us-atlas@3.0.1/states-10m.json').then(r=>r.json()).catch(()=>null)
]).then(([w,us])=>{
  land=topojson.feature(w,w.objects.land);
  if(us)borders=topojson.mesh(us,us.objects.states,(a,b)=>a!==b);
  draw();
});
})();
</script>
</body>
</html>
