<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { f: 0, dir: 1 };
  componentDidMount() { this.step(); }
  componentWillUnmount() { clearTimeout(this.tm); }
  step = () => {
    const { f, dir } = this.state;
    let delay = 700 + Math.random() * 500, nf = f + dir, nd = dir;
    if (nf > 5 || nf < 0) { nd = -dir; nf = f; delay = 1200 + Math.random() * 2600; }
    else if (Math.random() < 0.15) delay += 900 + Math.random() * 1200;
    this.setState({ f: nf, dir: nd });
    this.tm = setTimeout(this.step, delay);
  };
  renderVals() {
    const { f, dir } = this.state;
    const label = f === 0 ? 'L' : String(f);
    return { elevFloor: (dir > 0 ? '▲ ' : '▼ ') + label };
  }
}
</script>
